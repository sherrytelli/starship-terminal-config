"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#1A1B26)\
$os\
$username\
[](bg:#FF007F fg:#1A1B26)\
$directory\
[](fg:#FF007F bg:#00FFFF)\
${custom.git_upstream}\
$git_branch\
$git_status\
[](fg:#00FFFF bg:#7AA2F7)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
$python\
[](fg:#7AA2F7 bg:#24283B)\
$docker_context\
[](fg:#24283B bg:#BB9AF7)\
$time\
[ ](fg:#BB9AF7)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#1A1B26 fg:#00FFFF bold"
style_root = "bg:#1A1B26 fg:#FF007F bold"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#1A1B26"
disabled = true # Disabled by default

[directory]
style = "bg:#FF007F fg:#1A1B26 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#24283B fg:#00FFFF"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

# Show the GitHub logo before the git branch whenever the current branch is
# tracking a remote branch (like powerlevel10k does). Branches without an
# upstream only display the plain git branch segment.
[custom.git_upstream]
when = 'git rev-parse --abbrev-ref @{upstream} >/dev/null 2>&1'
require_repo = true
symbol = " \uf09b"
format = '[$symbol]($style)'
style = "bg:#00FFFF fg:#1A1B26 bold"

[git_branch]
symbol = ""
style = "bg:#00FFFF fg:#1A1B26 bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#00FFFF fg:#1A1B26 bold"
# The format strings together all active statuses
format = '[$all_status$ahead_behind ]($style)'

# Explicitly define symbols and include the exact counts (like p10k)
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ ⇡${ahead_count} ⇣${behind_count} "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
stashed = "≡${count} "
conflicted = "═${count} "

[golang]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
style = "bg:#7AA2F7 fg:#1A1B26 bold"
format = '[ $symbol ($version) (\($virtualenv\)) ]($style)'

[time]
disabled = false
time_format = "%r" # Hour:Minute Format
style = "bg:#BB9AF7 fg:#1A1B26 bold"
format = '[ ♥ $time ]($style)'

